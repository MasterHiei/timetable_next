name: Platform acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['example/android/**', 'example/ios/**', 'example/web/**', 'pubspec.yaml', 'example/pubspec.yaml', '.github/workflows/platforms.yml']
  push:
    branches: [main]
    paths: ['example/android/**', 'example/ios/**', 'example/web/**', 'pubspec.yaml', 'example/pubspec.yaml', '.github/workflows/platforms.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - {label: minimum, version: '3.38.1'}
          - {label: stable, version: ''}
        target:
          - {name: android, runner: ubuntu-latest, command: 'flutter build apk'}
          - {name: ios, runner: macos-latest, command: 'flutter build ios --no-codesign'}
          - {name: web, runner: ubuntu-latest, command: 'flutter build web'}
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        if: matrix.target.name == 'android'
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.sdk.version }}
      - run: flutter --version
      - run: flutter pub get
      - run: ${{ matrix.target.command }}
        working-directory: example
  android-interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: cd example && flutter test integration_test/app_test.dart -d emulator-5554
  ios-interaction:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - run: flutter pub get
      - name: Boot an available iPhone simulator and test
        shell: python
        run: |
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          runtime, phone = next((runtime, device) for runtime, devices in data['devices'].items() for device in devices if device['name'].startswith('iPhone'))
          print(f"Simulator: {runtime}, {phone['name']}, {phone['udid']}", flush=True)
          subprocess.run(['xcodebuild', '-version'], check=True)
          if phone['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', phone['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', phone['udid'], '-b'], check=True)
          subprocess.run(['flutter', 'test', 'integration_test/app_test.dart', '-d', phone['udid']], cwd='example', check=True)
  web-interaction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - uses: browser-actions/setup-chromedriver@v1
      - run: flutter pub get
      - name: Run browser integration tests
        working-directory: example
        run: |
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d web-server --browser-name=chrome --driver-port=4444 --headless
