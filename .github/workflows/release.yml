name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
  queue: max
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, changelog and main ancestry
        run: python3 tool/ci.py release-guard
  verify:
    needs: guard
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.repository == 'MasterHiei/timetable_next'
    needs: [guard, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pub.dev
    env:
      CANDIDATE_SHA256: ${{ needs.verify.outputs.sha256 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: candidate-package, path: build/candidate}
      - name: Check candidate identity and existing publication
        id: remote
        run: python3 tool/ci.py remote-check build/candidate/package.tar.gz build/candidate/manifest.json
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: steps.remote.outputs.exists == 'false'
        with: {sdk: '${{ needs.verify.outputs.dart }}'}
      - name: Publish exactly the verified archive with OIDC
        if: steps.remote.outputs.exists == 'false'
        run: dart pub publish --from-archive=build/candidate/package.tar.gz --force
      - name: Verify published contents with a bounded visibility wait
        if: steps.remote.outputs.exists == 'false'
        run: python3 tool/ci.py wait-published build/candidate/package.tar.gz build/candidate/manifest.json
  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_SHA256: ${{ needs.verify.outputs.sha256 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: candidate-package, path: build/candidate}
      - name: Create or resume the release without changing its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python3 tool/ci.py verify-archive build/candidate/package.tar.gz build/candidate/manifest.json
          python3 tool/ci.py release-notes build/release-notes.md
          if ! gh release view "$TAG" > /dev/null; then
            args=()
            if [[ "${VERSION%%+*}" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file build/release-notes.md "${args[@]}"
          fi
          gh release upload "$TAG" build/candidate/package.tar.gz build/candidate/manifest.json --clobber
  pages:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: select
        run: python3 tool/ci.py pages-needed
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.select.outputs.deploy == 'true'
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.select.outputs.deploy == 'true'
      - name: Check deployed availability and revision
        if: steps.select.outputs.deploy == 'true'
        run: python3 tool/ci.py check-deployed https://masterhiei.github.io/timetable_next/
