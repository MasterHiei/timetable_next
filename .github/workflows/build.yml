# Changes from upstream: added minimum/stable SDK and dependency lower-bound validation.
name: Package acceptance
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - {label: minimum, version: '3.38.1'}
          - {label: stable, version: ''}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.sdk.version }}
      - run: flutter --version
      - run: flutter pub get
      - name: Verify Dart formatting
        if: matrix.sdk.label == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/integration_test example/test_driver
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Verify dependency lower bounds
        run: |
          flutter pub downgrade
          flutter analyze --fatal-infos
          flutter test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.sdk.label }}
          path: coverage/lcov.info
