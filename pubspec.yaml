# Changes from upstream: renamed the package and updated its SDK, dependency and publication metadata.
name: timetable_next
description: Customizable, animated calendar widget including day, week, and month views
version: 1.0.0-beta.1
repository: https://github.com/MasterHiei/timetable_next
issue_tracker: https://github.com/MasterHiei/timetable_next/issues
screenshots:
  - description: Multi-date view in light mode
    path: doc/screenshot-MultiDateTimetable-light.webp
  - description: Multi-date view in dark mode
    path: doc/screenshot-MultiDateTimetable-dark.webp
  - description: Recurring layout
    path: doc/screenshot-RecurringMultiDateTimetable-light.webp
  - description: Compact month view
    path: doc/screenshot-CompactMonthTimetable-light.webp
  - description: Time overlays
    path: doc/screenshot-timeOverlays.webp

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  black_hole_flutter: ^1.2.0
  collection: ^1.15.0
  dart_date: ^1.5.3
  flutter:
    sdk: flutter
  flutter_layout_grid: ^2.0.5
  intl: '>=0.17.0 <0.21.0'
  meta: ^1.3.0

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
