# Changes from upstream: renamed the example, simplified dependencies and enabled native SwiftPM support.
name: timetable_next_example
description: A simple example app for the timetable_next package
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  black_hole_flutter: ^2.0.0
  flutter:
    sdk: flutter
  material_ui: ^1.8.0
  timetable_next:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
